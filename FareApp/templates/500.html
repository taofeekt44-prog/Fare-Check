{% load static %}

<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Something Went Wrong | FareCheck Nigeria</title>

    <link
        rel="stylesheet"
        href="{% static 'css/error.css' %}"
    >

</head>


<body>

    <main class="error-page">

        <div class="error-card">

            <div class="logo">
                ₦ FareCheck
            </div>

            <div class="error-code">
                500
            </div>

            <h1>
                Something went wrong
            </h1>

            <p>
                We're having trouble processing your request.
                Please try again in a moment.
            </p>

            <a
                href="{% url 'user_dashboard' %}"
                class="error-button"
            >
                Back to Dashboard
            </a>

            <a
                href="javascript:location.reload()"
                class="error-link"
            >
                Try Again
            </a>

            <div class="error-footer">
                FareCheck Nigeria
            </div>

        </div>

    </main>

</body>

</html>
